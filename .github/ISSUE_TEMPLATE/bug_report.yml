name: Bug report
description: Report a bug to help us improve the module
labels: ["bug"]
assignees:
    -   magicsunday
body:
    -   type: markdown
        attributes:
            value: |
                Thank you for reporting a bug! Please fill in the following details so we can investigate the issue.

    -   type: checkboxes
        id: preflight
        attributes:
            label: Before you report
            description: A few common installation mistakes cause most "not found" errors. Please rule them out first.
            options:
                -   label: "My installation includes the bundled dependencies — I used the release **asset zip**, Composer, or a documented from-source setup (a bare *Code → Download ZIP* / *Source code (zip)* on its own omits them). ([Why this matters](https://github.com/magicsunday/webtrees-fan-chart#troubleshooting))"
                    required: true
                -   label: "I checked the [Troubleshooting](https://github.com/magicsunday/webtrees-fan-chart#troubleshooting) section and my problem is not covered (or its fix did not help)."
                    required: true

    -   type: textarea
        id: description
        attributes:
            label: Description of the problem
            description: Describe what happened and how the error manifests itself.
            placeholder: "After clicking on a person, the chart shows a blank area instead of updating."
        validations:
            required: true

    -   type: textarea
        id: expected
        attributes:
            label: Expected behavior
            description: Explain what you expected to happen.
            placeholder: "The chart should update and show the selected person's ancestors."
        validations:
            required: true

    -   type: textarea
        id: steps
        attributes:
            label: Steps to reproduce
            description: List all steps necessary to reproduce the error.
            placeholder: |
                1. Open the chart for any individual
                2. Click on a person in the second generation
                3. Observe the blank area
        validations:
            required: true

    -   type: textarea
        id: errors
        attributes:
            label: Error messages or screenshots
            description: If an error message appears, copy the full text. Screenshots also help.
            placeholder: |
                Drag and drop or paste an image here.
        validations:
            required: false

    -   type: textarea
        id: console
        attributes:
            label: Browser console output
            description: |
                Many chart problems show up only in the browser console, not on the page. Open the developer tools of your browser, select the "Console" tab, repeat the steps that fail and paste the messages here. Write "none" if the console stays empty.
            render: shell
        validations:
            required: false

    -   type: input
        id: webtrees-version
        attributes:
            label: Webtrees version
            description: Which version of webtrees are you using?
        validations:
            required: true

    -   type: input
        id: module-version
        attributes:
            label: Module version
            description: Which version of the module are you using? (Check the control panel or composer.json)
        validations:
            required: true

    -   type: dropdown
        id: installation-method
        attributes:
            label: Installation method
            description: How did you install the module?
            options:
                -   Manual (ZIP download into modules_v4)
                -   Composer
                -   Git clone
                -   Docker (webtrees-docker)
                -   Other
        validations:
            required: true

    -   type: dropdown
        id: install-state
        attributes:
            label: Was this a fresh install or an update?
            description: |
                If you updated, did you fully remove the old module folder before extracting the new ZIP? Partial updates can leave behind older PHP files that mismatch the new vendor classes (a common cause of "Interface … not found" errors).
            options:
                -   Fresh install (module folder did not exist before)
                -   Update — old folder fully removed before extracting new version
                -   Update — extracted on top of existing folder
                -   Not sure
        validations:
            required: true

    -   type: textarea
        id: other-modules
        attributes:
            label: Other custom modules
            description: |
                List all other custom modules that are active, including themes. Modules can affect each other. The release ZIP of each magicsunday chart bundles its own copy of `webtrees-module-base`, so name their versions too.
            placeholder: |
                - Module name and version
        validations:
            required: false

    -   type: input
        id: theme
        attributes:
            label: Theme and palette
            description: Which theme is active when the problem occurs? Name the colour palette too, if the theme offers one.
            placeholder: "webtrees, colors (Sage), or the name of a custom theme"
        validations:
            required: true

    -   type: dropdown
        id: default-theme
        attributes:
            label: Does the problem also occur with the default webtrees theme?
            options:
                -   "Yes"
                -   "No"
                -   I use the default theme
                -   Not tested
        validations:
            required: true

    -   type: dropdown
        id: access
        attributes:
            label: How is your site reached?
            description: A reverse proxy or a hosting setup can add headers that block parts of a page.
            options:
                -   HTTPS
                -   HTTP
                -   HTTPS behind a reverse proxy
                -   HTTP behind a reverse proxy
                -   Not sure
        validations:
            required: false

    -   type: input
        id: browser
        attributes:
            label: Browser and operating system
            placeholder: "Browser name and version, operating system"
        validations:
            required: true

    -   type: input
        id: php-version
        attributes:
            label: PHP version
        validations:
            required: false

    -   type: dropdown
        id: database-engine
        attributes:
            label: Database engine
            description: |
                Which database is webtrees configured to use? Some bugs only surface on stricter engines — for example, MySQL 8 and MariaDB 10.5+ enable the `ONLY_FULL_GROUP_BY` SQL mode by default, which rejects queries that other engines accept.
            options:
                -   MySQL
                -   MariaDB
                -   SQLite
                -   PostgreSQL
                -   Other
        validations:
            required: false

    -   type: input
        id: database-version
        attributes:
            label: Database version
            description: |
                Server version string — e.g. the output of `SELECT VERSION();` or what your hoster shows in its control panel.
        validations:
            required: false

    -   type: textarea
        id: additional
        attributes:
            label: Additional information
            description: Any special circumstances? Was the module working before a change or update?
        validations:
            required: false

    -   type: textarea
        id: logs
        attributes:
            label: Log files
            description: Check the webtrees logs or server logs for related entries.
            render: shell
        validations:
            required: false
