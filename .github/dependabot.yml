version: 2

# Every ecosystem sets an explicit commit-message prefix. Without one,
# Dependabot copies the patterns it detects in the history, which can produce
# `chore(deps): …` subjects and PR titles the commit-convention gate rejects.
# A prefix ending in a letter gets a colon appended:
# "Update dependencies: bump …".
updates:
    -   package-ecosystem: composer
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            composer:
                patterns:
                    - "*"

    -   package-ecosystem: npm
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        cooldown:
            default-days: 7
            # Cooldown filtering on this git tag pin has made Dependabot
            # propose older tags instead of newer ones.
            exclude:
                - "@magicsunday/coding-standard"
        commit-message:
            prefix: "Update dependencies"
        groups:
            npm:
                patterns:
                    - "*"
                # The chart-lib bundle is baked into the committed *.min.js at
                # `make build` time, which Dependabot cannot run. Keep it out of
                # the grouped, auto-merged PR so it always arrives as its own
                # PR that a human reviews and rebuilds the bundle for.
                exclude-patterns:
                    - "@magicsunday/webtrees-chart-lib"

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            github-actions:
                patterns:
                    - "*"
