name: Security

on:
    push:
        branches: [main, master]
    pull_request:
    schedule:
        - cron: '27 3 * * 1'

permissions:
    contents: read

jobs:
    code-scanning:
        uses: magicsunday/.github/.github/workflows/code-scanning.yml@582bcf4d3ac9369214b28c2b84dd6029faecbb7e # main
        permissions:
            contents: read
            security-events: write

    zizmor:
        uses: magicsunday/.github/.github/workflows/zizmor.yml@582bcf4d3ac9369214b28c2b84dd6029faecbb7e # main
        permissions:
            contents: read
            security-events: write

    scorecard:
        # Scorecard publishes against the default branch; skip pull-request runs.
        if: github.event_name != 'pull_request'
        uses: magicsunday/.github/.github/workflows/scorecard.yml@582bcf4d3ac9369214b28c2b84dd6029faecbb7e # main
        permissions:
            contents: read
            security-events: write
            id-token: write

    dependency-review:
        # The dependency-review action only runs in a pull-request context.
        if: github.event_name == 'pull_request'
        uses: magicsunday/.github/.github/workflows/dependency-review.yml@582bcf4d3ac9369214b28c2b84dd6029faecbb7e # main
        permissions:
            contents: read
            pull-requests: write

    yamllint:
        uses: magicsunday/.github/.github/workflows/yamllint.yml@582bcf4d3ac9369214b28c2b84dd6029faecbb7e # main
        permissions:
            contents: read
