name: Greetings

on:
    issues:
        types: [opened]
    # No step checks out the repository or runs code of the pull request, and
    # the event text never reaches a shell, so this trigger is safe here.
    pull_request_target:  # zizmor: ignore[dangerous-triggers]
        types: [opened]

permissions:
    contents: read

jobs:
    greeting:
        # Skip the Renovate and GitHub Actions bots, they need no welcome. The
        # job is inlined and not a reusable call, so this skip happens before
        # any permission setup.
        if: github.actor != 'renovate[bot]' && github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: Greet first-time contributors
              uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
              with:
                  repo_token: ${{ github.token }}
                  issue_message: >
                      Thanks for opening your first issue in this project! A
                      maintainer will take a look as soon as possible. For bugs,
                      a minimal reproduction helps a lot. For feature requests,
                      a clear use case helps.
                  pr_message: >
                      Thanks for your first pull request to this project! Please
                      make sure the project's checks pass before requesting
                      review. A maintainer will get back to you soon.
