name: Bundle

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    bundle-freshness:
        uses: magicsunday/.github/.github/workflows/bundle-freshness.yml@main
        permissions:
            contents: read
        with:
            node-image: ghcr.io/magicsunday/webtrees-docker-module-base:node24@sha256:9a38e3298f9522b10f77896b85e6afc0786aea7ad91df75017cd25a96726b84d
        secrets:
            push_token: ${{ secrets.BUNDLE_PUSH_TOKEN }}
