name: CI

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    # The PHP gates come from the shared reusable so the canonical step list lives
    # in one place. Mutation testing is switched on there and runs on one leg of its
    # matrix, outside the ci:test aggregate. Copy-paste detection runs in the shared
    # Node-only lane below, since jscpd is a Node tool.
    php:
        uses: magicsunday/.github/.github/workflows/php-quality.yml@main
        with:
            run-infection: true
        permissions:
            contents: read

    cpd:
        uses: magicsunday/.github/.github/workflows/cpd.yml@main
        permissions:
            contents: read

    js:
        name: JS and release zip
        runs-on: ubuntu-latest

        steps:
            - id: checkout
              name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: setup_node
              name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm

            - id: setup_php
              name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.3'
                  tools: composer:v2

            - name: Validate composer.json and composer.lock
              run: composer validate

            - id: install
              name: Install dependencies
              run: |
                  composer install --no-progress --no-interaction
                  npm ci

            - id: js-lint
              name: JS Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:lint

            - id: js-format
              name: JS Format
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:format

            - id: js-typecheck
              name: JS Typecheck
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:typecheck

            - id: js-unit
              name: JS Unit Tests
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:js:unit

            # Runs LAST: 'make dist' invokes 'composer install --no-dev' which
            # strips the dev packages from .build/vendor, so any later
            # composer-driven step would fail.
            - id: dist-smoke
              name: Release zip smoke test
              if: ${{ success() }}
              run: |
                  make dist
                  make dist-smoke
                  rm -f *.zip
