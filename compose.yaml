services:
    node:
        image: ghcr.io/magicsunday/webtrees-docker-module-base:node24@sha256:9a38e3298f9522b10f77896b85e6afc0786aea7ad91df75017cd25a96726b84d
        working_dir: /app
        volumes:
            - ./:/app
            # The chart-lib node_modules entry is a symlink to the sibling
            # ../webtrees-chart-lib package; rollup must see the target
            # inside the container or it leaves chart-lib external (UMD
            # bundles then break in the browser).
            # Docker creates ../webtrees-chart-lib as an empty root-owned
            # directory when the clone is absent. See AGENTS.md.
            - ../webtrees-chart-lib:/webtrees-chart-lib
